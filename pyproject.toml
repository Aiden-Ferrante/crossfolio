[project]
name = "crossfolio"
version = "0.1.0"
description = "Neural portfolio allocator: stage-0 SGD -> linear -> cross-sectional attention. Learning project, not an edge."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    "numpy>=2.0",
    "duckdb>=1.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
crossfolio = "crossfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossfolio"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
