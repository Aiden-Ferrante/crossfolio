[project]
name = "crossfolio"
version = "0.1.0"
description = "Neural portfolio allocator: stage-0 SGD -> linear -> cross-sectional attention. Learning project, not an edge."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    "numpy>=2.0",
    "duckdb>=1.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
cpu = ["torch>=2.13"]
cu130 = ["torch>=2.13"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
crossfolio = "crossfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossfolio"]

# Torch comes from default PyPI unless an extra picks an index:
#   uv sync                 -> PyPI torch (CPU everywhere; CUDA-bundled on x86_64 Linux)
#   uv sync --extra cpu     -> slim CPU-only wheels (what CI uses)
#   uv sync --extra cu130   -> CUDA 13.0 wheels (the author's GPU box)
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
